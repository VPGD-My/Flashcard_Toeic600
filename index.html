<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thẻ từ TOEIC 600</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF3; --card:#FFFFFF; --rule:#D3DEEE; --margin:#E0475B; --ink:#18213A; --muted:#5A6479;
  --line:#C9D2E0; --know:#1F8A68; --know-bg:#DDF2EA; --again:#C9374B; --again-bg:#FBE3E6; --pin:#F2B33D;
  --chip:#DCE3EE; --shadow:0 1px 0 rgba(24,33,58,.06),0 8px 24px -12px rgba(24,33,58,.25);
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111727; --card:#1B2337; --rule:#26314B; --margin:#E8606F; --ink:#E6EBF5; --muted:#99A3B8;
  --line:#2C3752; --know:#4CC79C; --know-bg:#163A30; --again:#F07484; --again-bg:#40202A; --chip:#252F47;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111727; --card:#1B2337; --rule:#26314B; --margin:#E8606F; --ink:#E6EBF5; --muted:#99A3B8;
  --line:#2C3752; --know:#4CC79C; --know-bg:#163A30; --again:#F07484; --again-bg:#40202A; --chip:#252F47;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--margin);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.15;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;margin:28px 0 10px;color:var(--muted)}
.sub{color:var(--muted);margin:0;font-size:14px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:13px;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon svg{width:20px;height:20px}
/* stats strip */
.today{margin-top:18px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;position:relative;overflow:hidden}
.today::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.today .in{padding-left:20px}
.today .n{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1}
.today .l{font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--know);border-radius:6px;transition:width .4s}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
/* topic list */
.cat{margin-top:6px}
.topic{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:0;border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.topic .num{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.topic .num.done{background:var(--know);color:#fff}
.topic .nm{flex:1;min-width:0}
.topic .nm b{display:block;font-weight:600;font-size:15px}
.topic .nm span{display:block;font-size:13px;color:var(--muted)}
.topic .mini{width:64px;flex:none}
.topic .mini .bar{margin-top:0;height:5px}
.topic .mini small{display:block;text-align:right;font-size:12px;color:var(--muted);margin-top:4px}
/* flashcard */
.stage{position:relative;height:min(62vh,440px);perspective:1200px;margin:14px 0 18px;touch-action:pan-y}
.fc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);cursor:pointer;user-select:none}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--card);box-shadow:var(--shadow);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);background-position:0 58px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 24px 28px 44px;overflow:hidden}
.face::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}
.face.back{transform:rotateY(180deg)}
.face .pos{position:absolute;top:16px;left:44px;font-size:13px;font-weight:600;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:20px}
.face .box{position:absolute;top:16px;right:18px;display:flex;gap:3px}
.face .box i{width:7px;height:7px;border-radius:50%;background:var(--chip)}
.face .box i.on{background:var(--pin)}
.word{font-family:var(--serif);font-weight:700;font-size:clamp(32px,10vw,46px);line-height:1.1;margin:0;word-break:break-word;background:var(--card);padding:0 6px}
.ipa{font-size:17px;color:var(--muted);margin-top:10px;background:var(--card);padding:0 6px}
.mean{font-size:clamp(22px,6.5vw,28px);font-weight:600;line-height:1.3;background:var(--card);padding:2px 6px}
.small-word{font-family:var(--serif);font-size:20px;margin-top:14px;color:var(--muted);background:var(--card);padding:0 6px}
.speak{margin-top:18px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.speak svg{width:18px;height:18px}
.hint{position:absolute;bottom:14px;left:0;right:0;font-size:12px;color:var(--muted)}
.stamp{position:absolute;top:24px;font-weight:700;font-size:20px;padding:4px 12px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(-8deg);pointer-events:none;z-index:3;background:var(--card)}
.stamp.k{right:24px;color:var(--know);border-color:var(--know)}
.stamp.a{left:24px;color:var(--again);border-color:var(--again);transform:rotate(8deg)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:0;border-radius:16px;padding:16px 10px;font-weight:600;font-size:16px}
.act.a{background:var(--again-bg);color:var(--again)}
.act.k{background:var(--know-bg);color:var(--know)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;margin:0}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* quiz */
.q{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;margin:14px 0}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;font-size:16px}
.opt.right{border-color:var(--know);background:var(--know-bg);color:var(--know);font-weight:600}
.opt.wrong{border-color:var(--again);background:var(--again-bg);color:var(--again)}
/* search */
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;margin-top:14px}
.row{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.row .w{flex:1;min-width:0}
.row .w b{font-family:var(--serif);font-size:18px}
.row .w em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.row .w span{display:block;font-size:14px;color:var(--muted)}
.row .icon{width:36px;height:36px;border-radius:10px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.done-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:32px 22px;text-align:center;margin-top:20px}
.done-card .n{font-family:var(--serif);font-size:52px;font-weight:700;line-height:1;color:var(--know)}
.done-card .btns{display:grid;gap:10px;margin-top:22px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.switch{width:50px;height:30px;border-radius:30px;border:0;background:var(--chip);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--know)}
.switch[aria-checked="true"]::after{left:23px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow)}
.mode b{display:block;font-size:16px}
.mode span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.mode:disabled{opacity:.45;cursor:default}
.chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:20px}
.pattern{font-family:var(--serif);font-size:22px;letter-spacing:.06em;margin-top:16px;color:var(--muted);word-break:break-word}
.spell{width:100%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;font-family:var(--serif);font-size:22px;text-align:center}
.spell:focus{border-color:var(--ink);outline:none}
.linkbtn{display:block;margin:14px auto 0;border:0;background:none;color:var(--muted);font-size:14px;text-decoration:underline}
.q.ok{box-shadow:inset 0 0 0 2px var(--know),var(--shadow)}
.q.bad{box-shadow:inset 0 0 0 2px var(--again),var(--shadow)}
.verdict{font-weight:700}
.q.ok .verdict{color:var(--know)}
.q.bad .verdict{color:var(--again)}
.typed{margin-top:8px;font-size:15px;color:var(--again)}
.panel{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.panel .seg{margin-top:0}
.panel .seg button{font-size:13px;padding:8px 4px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px}
.lbl-row .lbl{margin:0}
.catlbl{display:flex;align-items:center;gap:8px;border:0;background:none;padding:12px 0 6px;font-size:14px;font-weight:600;text-align:left}
.catlbl .tick{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none}
.catlbl[aria-pressed="true"] .tick{background:var(--know);border-color:var(--know);box-shadow:inset 0 0 0 2px var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.3}
.chipbtn small{color:var(--muted);font-size:11px}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipbtn[aria-pressed="true"] small{color:inherit;opacity:.75}
.filterbtn{width:100%;display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;text-align:left}
.filterbtn b{background:var(--ink);color:var(--bg);border-radius:10px;padding:0 8px;font-size:12px;line-height:20px}
.filterbtn span{margin-left:auto;font-weight:500;font-size:13px;color:var(--muted)}
.studybar{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin:12px 0 4px}
.studybar>span{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
.tbadge{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--margin);border:1px solid var(--margin);border-radius:6px;padding:0 5px;vertical-align:2px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink);font-weight:600}
nav button .dot{position:relative}
nav button .badge{position:absolute;top:-4px;right:-10px;background:var(--margin);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>

/* speech */
let voice=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google|Microsoft Aria|Jenny/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){if(!("speechSynthesis" in window)){toast("Thiết bị này chưa hỗ trợ đọc phát âm");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;if(voice)u.voice=voice;speechSynthesis.speak(u)}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),1800)}

/* routing (in-memory) */
let view={name:"home"};let tab="home";
function go(v){view=v;if(["home","review","search","settings"].includes(v.name))tab=v.name;render();window.scrollTo(0,0)}
function renderNav(){const due=dueList().length;const it=[["home","Chủ đề",I.cards],["review","Ôn tập",I.repeat],["search","Tra từ",I.search],["settings","Cài đặt",I.gear]];
 $("#nav").innerHTML=it.map(([k,l,ic])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}><span class="dot">${ic}${k==="review"&&due?`<span class="badge">${due>99?"99+":due}</span>`:""}</span>${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>go({name:b.dataset.tab}))}

function render(){renderNav();const a=$("#app");({home:Home,topic:Topic,study:Study,spell:Spell,quiz:Quiz,review:Review,search:Search,settings:Settings}[view.name])(a)}

function Home(a){const k=ALL.filter(w=>known(w.id)).length,s=ALL.filter(w=>seen(w.id)).length,due=dueList().length;
 let h=`<h1>Thẻ từ TOEIC 600</h1><p class="sub">${NT} chủ đề, ${ALL.length} từ. Học từng chủ đề, ôn lại đúng lúc sắp quên.</p>
 <div class="today"><div class="in"><div class="n">${k}<span style="font-size:20px;color:var(--muted)"> /${ALL.length}</span></div><div class="l">từ đã thuộc · ${s} từ đã gặp${S.streak.n?` · chuỗi ${S.streak.n} ngày`:""}</div><div class="bar"><i style="width:${k/ALL.length*100}%"></i></div></div>
 <button class="btn" id="goRev" ${due?"":"disabled"}>${due?`Ôn ${due} từ`:"Chưa có từ đến hạn"}</button></div>`;
 for(const [name,from,to] of cats()){h+=`<h2>${name}</h2><div class="cat">`;
  for(let t=from;t<=to;t++){const T=TOPICS[t],x=topicStats(t);h+=`<button class="topic" data-t="${t}"><span class="num ${x.k===x.n?"done":""}">${t===100?"★":t}</span><span class="nm"><b>${esc(T.vi)}</b><span>${esc(T.en)}</span></span><span class="mini"><span class="bar"><i style="width:${x.k/x.n*100}%"></i></span><small>${x.k}/${x.n}</small></span></button>`}
  h+="</div>"}
 a.innerHTML=h;a.querySelectorAll(".topic").forEach(b=>b.onclick=()=>go({name:"topic",t:+b.dataset.t}));const r=$("#goRev");if(r)r.onclick=()=>startReview()}

function Topic(a){const T=TOPICS[view.t],x=topicStats(view.t);
 a.innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Quay lại">${I.back}</button><div class="t"><b>${view.t===100?"":view.t+". "}${esc(T.vi)}</b><span>${esc(T.en)} · ${x.k}/${x.n} đã thuộc</span></div></div>
 <div class="actions" style="margin-top:14px"><button class="btn" id="st">${x.s?"Học tiếp":"Bắt đầu học"}</button><button class="btn ghost" id="qz" ${T.words.length<4?"disabled":""}>Trắc nghiệm</button></div><button class="btn ghost" id="sp2" style="width:100%;margin-top:10px">Luyện chính tả</button>
 <h2>Danh sách từ</h2>${view.t===100?`<p class="sub" style="margin:-4px 0 6px">Các từ bạn đã tra và thêm vào. Học, ôn và luyện chính tả như mọi chủ đề khác.</p>`:""}${T.words.map(w=>row(w)+(view.t===100?`<button class="linkbtn" data-del="${esc(w.w)}" style="margin:2px 0 6px auto">Xóa khỏi sổ</button>`:"")).join("")}`;
 a.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const w=b.dataset.del;S.custom=(S.custom||[]).filter(o=>o.w!==w);delete S.cards["100-"+w];syncCustom();save();toast("Đã xóa “"+w+"”");if(!TOPICS[100].words.length)go({name:"home"});else render()});
 $("#bk").onclick=()=>go({name:"home"});$("#st").onclick=()=>startStudy(T.words,{t:view.t});$("#qz").onclick=()=>startQuiz(view.t);$("#sp2").onclick=()=>startSpell(shuffle(T.words),{t:view.t});bindRows(a)}
function row(w){const c=st(w.id);const tb=w.title?`<span class="tbadge">tên chủ đề</span>`:"";const tag=c?(c.b>=3?"✓ đã thuộc":"đang học"):"";return `<div class="row"><div class="w"><b>${esc(w.w)}</b>${tb}<em>(${w.p}) ${esc(w.ipa)}</em><span>${esc(w.m)}${tag?` · <span style="display:inline;color:${c.b>=3?"var(--know)":"var(--pin)"}">${tag}</span>`:""}</span></div><button class="icon" data-say="${esc(w.w)}" aria-label="Nghe phát âm ${esc(w.w)}">${I.sound}</button></div>`}
function bindRows(a){a.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say))}

/* study session */
let sess=null;
function startStudy(words,meta){const now=Date.now();const order=[...words].sort((x,y)=>{const r=w=>{const c=st(w.id);if(!c)return 1;if(c.d<=now)return 0;return 2+c.b};return r(x)-r(y)});
 sess={queue:order.map(w=>w.id),total:order.length,ok:0,miss:new Set(),meta,flipped:false};go({name:"study"})}
function startReview(mode){const d=dueList();if(!d.length){go({name:"review"});return}const ws=d.slice(0,30);if(mode==="spell")startSpell(shuffle(ws),{review:true});else startStudy(ws,{review:true})}
const byId=id=>ALL.find(w=>w.id===id);
function Study(a){if(!sess){go({name:"home"});return}
 if(!sess.queue.length){const T=sess.meta.t?TOPICS[sess.meta.t]:null;
  a.innerHTML=`<div class="done-card"><div class="n">${sess.ok}</div><p style="margin:8px 0 0;font-weight:600">từ đã qua trong lượt này</p><p class="sub">${sess.miss.size?`Có ${sess.miss.size} từ bạn phải xem lại nhiều lần, các từ này sẽ quay lại sớm hơn.`:"Không vấp từ nào. Hẹn gặp lại các từ này ở lượt ôn sau."}</p>
  <div class="btns">${T?`<button class="btn" id="qz">Làm trắc nghiệm chủ đề này</button><button class="btn ghost" id="again">Học lại chủ đề</button>`:""}<button class="btn ghost" id="home">Về danh sách chủ đề</button></div></div>`;
  if(T){$("#qz").onclick=()=>startQuiz(sess.meta.t);$("#again").onclick=()=>startStudy(T.words,sess.meta)}$("#home").onclick=()=>go({name:"home"});return}
 const w=byId(sess.queue[0]);const c=st(w.id);const b=c?c.b:0;const done=sess.total-sess.queue.length+0;
 const enFront=S.dir==="en";
 const dots=`<span class="box" aria-label="Mức nhớ ${b}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span>`;
 const front=enFront?`<span class="pos">${POS[w.p]}</span>${dots}<p class="word">${esc(w.w)}</p><div class="ipa">${esc(w.ipa)}</div><button class="speak" data-say>${I.sound}Nghe</button><div class="hint">Chạm để lật thẻ</div>`
  :`<span class="pos">${POS[w.p]}</span>${dots}<div class="mean">${esc(w.m)}</div><div class="hint">Nhớ ra từ tiếng Anh chưa? Chạm để lật</div>`;
 const back=enFront?`<span class="pos">${POS[w.p]}</span><div class="mean">${esc(w.m)}</div><div class="small-word">${esc(w.w)}</div><button class="speak" data-say>${I.sound}Nghe</button>`
  :`<span class="pos">${POS[w.p]}</span><p class="word">${esc(w.w)}</p><div class="ipa">${esc(w.ipa)}</div><button class="speak" data-say>${I.sound}Nghe</button>`;
 a.innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Thoát">${I.back}</button><div class="t"><b>${sess.meta.t?esc(TOPICS[sess.meta.t].vi):(sess.meta.label||"Ôn tập")}</b><span>Còn ${sess.queue.length} thẻ</span></div></div>
 <div class="prog"><span class="bar"><i style="width:${(sess.ok/sess.total)*100}%"></i></span>${sess.ok}/${sess.total}</div>
 <div class="stage" id="stage"><span class="stamp a" id="sa">Chưa nhớ</span><span class="stamp k" id="sk">Nhớ rồi</span>
 <div class="fc" id="fc" role="button" tabindex="0" aria-label="Thẻ từ, chạm để lật"><div class="face front">${front}</div><div class="face back">${back}</div></div></div>
 <div class="actions"><button class="act a" id="ba">← Chưa nhớ</button><button class="act k" id="bkw">Nhớ rồi →</button></div>
 <p class="sub" style="text-align:center;margin-top:12px;font-size:13px">Vuốt trái hoặc phải trên thẻ để chấm nhanh</p>`;
 $("#bk").onclick=()=>{sess=null;go(view.t?{name:"home"}:{name:"home"})};
 const fc=$("#fc");a.querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(w.w)});
 const flip=()=>{fc.classList.toggle("flip");if(!enFront&&fc.classList.contains("flip")&&S.autoSpeak)speak(w.w)};
 fc.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}};
 $("#ba").onclick=()=>answer(false);$("#bkw").onclick=()=>answer(true);
 if(enFront&&S.autoSpeak)setTimeout(()=>speak(w.w),250);
 // swipe
 let x0=null,y0=0,dx=0,moved=false;const stage=$("#stage"),sa=$("#sa"),sk=$("#sk");
 stage.onpointerdown=e=>{if(e.target.closest("[data-say]"))return;x0=e.clientX;y0=e.clientY;dx=0;moved=false;fc.style.transition="none"};
 stage.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(e.clientY-y0)){moved=true;const f=fc.classList.contains("flip")?" rotateY(180deg)":"";fc.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)${f}`;sk.style.opacity=Math.max(0,Math.min(1,dx/90));sa.style.opacity=Math.max(0,Math.min(1,-dx/90))}};
 const end=()=>{if(x0===null)return;fc.style.transition="";x0=null;if(moved&&Math.abs(dx)>90){answer(dx>0);return}fc.style.transform="";sk.style.opacity=0;sa.style.opacity=0;if(!moved)flip()};
 stage.onpointerup=end;stage.onpointercancel=()=>{x0=null;fc.style.transition="";fc.style.transform="";sk.style.opacity=0;sa.style.opacity=0};
}
function answer(ok){const id=sess.queue.shift();if(ok){if(!sess.miss.has(id))grade(id,true);sess.ok++}else{grade(id,false);sess.miss.add(id);sess.queue.splice(Math.min(3,sess.queue.length),0,id)}
 if(navigator.vibrate)try{navigator.vibrate(ok?12:[8,40,8])}catch(e){}render()}

/* spelling */
let spl=null;
const normAns=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\s\-]+/g," ").trim();
function startSpell(words,meta){spl={queue:words.map(w=>w.id),total:words.length,ok:0,miss:new Set(),meta,phase:"input",hint:0,typed:"",right:false};go({name:"spell"})}
function hintText(w,lv){let n=0;return w.w.split("").map(ch=>{if(/[a-zé]/i.test(ch)){n++;return n<=lv?ch:"_"}return ch===" "?"\u00a0\u00a0":ch}).join(" ")}
function Spell(a){if(!spl){go({name:"home"});return}
 const T=spl.meta.t?TOPICS[spl.meta.t]:null;const exitTo=T?{name:"topic",t:T.id}:{name:"review"};
 if(!spl.queue.length){a.innerHTML=`<div class="done-card"><div class="n">${spl.ok}/${spl.total}</div><p style="margin:8px 0 0;font-weight:600">từ gõ đúng ngay lần đầu, không cần gợi ý</p><p class="sub">${spl.miss.size?`Có ${spl.miss.size} từ phải xem gợi ý hoặc gõ lại. Các từ này sẽ quay lại sớm hơn trong phần ôn tập.`:"Không sai chữ nào."}</p><div class="btns">${T?`<button class="btn" id="again">Luyện lại chủ đề này</button>`:""}<button class="btn ghost" id="home">${T?"Về chủ đề":"Về ôn tập"}</button></div></div>`;
  if(T)$("#again").onclick=()=>startSpell(shuffle(T.words),spl.meta);$("#home").onclick=()=>{spl=null;go(exitTo)};return}
 const w=byId(spl.queue[0]);const left=spl.queue.length;
 const head=`<div class="top"><button class="icon" id="bk" aria-label="Thoát">${I.back}</button><div class="t"><b>${T?esc(T.vi):(spl.meta.label||"Ôn tập")}: chính tả</b><span>Còn ${left} từ</span></div></div><div class="prog"><span class="bar"><i style="width:${(spl.total-left)/spl.total*100}%"></i></span>${spl.total-left}/${spl.total}</div>`;
 if(spl.phase==="input"){const letters=(w.w.match(/[a-zé]/gi)||[]).length;
  a.innerHTML=head+`<div class="q"><span class="chip">${POS[w.p]}</span><div class="mean" style="margin-top:12px">${esc(w.m)}</div><div class="pattern">${esc(hintText(w,spl.hint))}</div><div class="sub" style="font-size:13px;margin-top:4px">${letters} chữ cái</div></div>
  <input class="spell" id="ans" type="text" value="${esc(spl.typed)}" placeholder="Gõ từ tiếng Anh" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Gõ từ tiếng Anh">
  <div class="actions" style="margin-top:12px"><button class="btn ghost" id="hint" ${spl.hint>=letters-1?"disabled":""}>Gợi ý 1 chữ</button><button class="btn" id="chk">Kiểm tra</button></div>
  <button class="linkbtn" id="skip">Không nhớ, xem đáp án</button>`;
  const inp=$("#ans");setTimeout(()=>inp.focus(),60);
  const check=()=>{spl.typed=inp.value;if(!spl.typed.trim()){toast("Gõ từ trước khi kiểm tra");return}spl.right=normAns(spl.typed)===normAns(w.w);if(spl.right){if(!spl.miss.has(w.id))grade(w.id,true)}else{grade(w.id,false);spl.miss.add(w.id)}spl.phase="result";render()};
  inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();check()}};
  $("#chk").onclick=check;
  $("#hint").onclick=()=>{spl.typed=inp.value;spl.hint++;spl.miss.add(w.id);render()};
  $("#skip").onclick=()=>{spl.typed="";spl.right=false;grade(w.id,false);spl.miss.add(w.id);spl.phase="result";render()};
 } else {
  a.innerHTML=head+`<div class="q ${spl.right?"ok":"bad"}"><div class="verdict">${spl.right?"Chính xác":"Chưa đúng"}</div><p class="word" style="font-size:36px;margin-top:6px">${esc(w.w)}</p><div class="ipa">${esc(w.ipa)}</div><div class="sub" style="margin-top:8px">${esc(w.m)}</div>${!spl.right&&spl.typed?`<div class="typed">Bạn gõ: <s>${esc(spl.typed)}</s></div>`:""}<button class="speak" data-say>${I.sound}Nghe</button></div>
  <button class="btn" id="nx" style="width:100%">${spl.right?"Tiếp tục":"Tiếp tục, từ này sẽ quay lại"}</button>`;
  a.querySelector("[data-say]").onclick=()=>speak(w.w);if(S.autoSpeak)setTimeout(()=>speak(w.w),150);
  if(navigator.vibrate)try{navigator.vibrate(spl.right?12:[8,40,8])}catch(e){}
  const nx=$("#nx");setTimeout(()=>nx.focus(),60);
  nx.onclick=()=>{const id=spl.queue.shift();if(spl.right){if(!spl.miss.has(id))spl.ok++}else spl.queue.splice(Math.min(3,spl.queue.length),0,id);spl.phase="input";spl.hint=0;spl.typed="";spl.right=false;render()};
 }
 $("#bk").onclick=()=>{spl=null;go(exitTo)}}

/* quiz */
let qz=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(t){const ws=shuffle(TOPICS[t].words);qz={t,items:ws.map(w=>{const pool=shuffle(TOPICS[t].words.filter(o=>o.id!==w.id&&o.m!==w.m&&o.w!==w.w)).slice(0,3);return{w,opts:shuffle([w,...pool])}}),i:0,score:0,picked:null,wrong:[]};go({name:"quiz"})}
function Quiz(a){if(!qz){go({name:"home"});return}const T=TOPICS[qz.t];
 if(qz.i>=qz.items.length){a.innerHTML=`<div class="done-card"><div class="n">${qz.score}/${qz.items.length}</div><p style="margin:8px 0 0;font-weight:600">câu đúng · ${esc(T.vi)}</p>
  ${qz.wrong.length?`<p class="sub" style="margin-top:8px">Các từ làm sai đã được đưa về đầu hàng ôn tập:</p><div style="text-align:left;margin-top:8px">${qz.wrong.map(w=>row(w)).join("")}</div>`:`<p class="sub">Đúng hết. Chủ đề này bạn nắm khá chắc rồi.</p>`}
  <div class="btns">${qz.wrong.length?`<button class="btn" id="fix">Học lại ${qz.wrong.length} từ sai</button>`:""}<button class="btn ghost" id="re">Làm lại trắc nghiệm</button><button class="btn ghost" id="home">Về danh sách chủ đề</button></div></div>`;
  bindRows(a);const f=$("#fix");if(f)f.onclick=()=>startStudy(qz.wrong,{t:qz.t});$("#re").onclick=()=>startQuiz(qz.t);$("#home").onclick=()=>go({name:"home"});return}
 const it=qz.items[qz.i];const en=S.dir==="en";
 a.innerHTML=`<div class="top"><button class="icon" id="bk" aria-label="Thoát">${I.back}</button><div class="t"><b>Trắc nghiệm: ${esc(T.vi)}</b><span>Câu ${qz.i+1}/${qz.items.length} · đúng ${qz.score}</span></div></div>
 <div class="prog"><span class="bar"><i style="width:${qz.i/qz.items.length*100}%"></i></span></div>
 <div class="q">${en?`<p class="word" style="font-size:36px">${esc(it.w.w)}</p><div class="ipa">(${it.w.p}) ${esc(it.w.ipa)}</div><button class="speak" data-say>${I.sound}Nghe</button>`:`<div class="mean">${esc(it.w.m)}</div><div class="ipa">(${POS[it.w.p]})</div>`}</div>
 <div class="opts">${it.opts.map((o,i)=>{let cl="";if(qz.picked!==null){if(o.id===it.w.id)cl="right";else if(i===qz.picked)cl="wrong"}return `<button class="opt ${cl}" data-i="${i}" ${qz.picked!==null?"disabled":""}>${esc(en?o.m:o.w)}</button>`}).join("")}</div>
 ${qz.picked!==null?`<button class="btn" id="nx" style="width:100%;margin-top:16px">${qz.i+1<qz.items.length?"Câu tiếp theo":"Xem kết quả"}</button>`:""}`;
 $("#bk").onclick=()=>{qz=null;go({name:"topic",t:T.id})};a.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(it.w.w));
 if(en&&qz.picked===null&&S.autoSpeak)setTimeout(()=>speak(it.w.w),200);
 a.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{qz.picked=+b.dataset.i;const ok=it.opts[qz.picked].id===it.w.id;if(ok){qz.score++;if(!seen(it.w.id))grade(it.w.id,true)}else{grade(it.w.id,false);qz.wrong.push(it.w)}if(!en)speak(it.w.w);render()});
 const nx=$("#nx");if(nx)nx.onclick=()=>{qz.i++;qz.picked=null;render()}}

function Review(a){const d=dueList();
 const rv=S.rv=Object.assign({src:"topics",topics:[],mode:"flip",n:20},S.rv||{});
 const learned=ALL.filter(w=>seen(w.id));
 const lapsed=ALL.filter(w=>((st(w.id)||{}).l||0)>0).sort((x,y)=>st(y.id).l-st(x.id).l||st(x.id).b-st(y.id).b);
 const p=rv.src==="topics"?ALL.filter(w=>rv.topics.includes(w.t)):rv.src==="learned"?learned:lapsed;
 const take=rv.n?Math.min(rv.n,p.length):p.length;
 const segBtn=(k,v,l)=>`<button data-${k}="${v}" aria-pressed="${String(rv[k])===String(v)}">${l}</button>`;
 let topicsHtml="";
 if(rv.src==="topics"){topicsHtml=`<div class="lbl-row"><span class="lbl">Chủ đề · đã chọn ${rv.topics.length}</span><button class="linkbtn" id="tAll" style="margin:0">${rv.topics.length>=NT?"Bỏ chọn hết":"Chọn tất cả"}</button></div>`+topicPicker(rv.topics)}
 const emptyMsg=rv.src==="topics"?"Chọn ít nhất 1 chủ đề để bắt đầu.":rv.src==="learned"?"Chưa có từ nào đã học. Hãy học một chủ đề trước.":"Chưa có từ nào bị quên. Từ đã học mà bạn chấm “Chưa nhớ” hoặc gõ sai sẽ vào đây, từ quên nhiều lần nhất đứng đầu.";
 a.innerHTML=`<h1>Ôn tập</h1><p class="sub">Từ bạn đã học sẽ quay lại sau 1, 3, 7, 14 rồi 30 ngày. Mỗi lần nhớ đúng, khoảng cách dài thêm; quên thì bắt đầu lại.</p>
 <div class="today"><div class="in"><div class="n">${d.length}</div><div class="l">từ đến hạn ôn hôm nay</div></div></div>
 <div class="modes"><button class="mode" id="mFlip" ${d.length?"":"disabled"}><b>Lật thẻ</b><span>Nhìn từ, nhớ nghĩa rồi tự chấm</span></button><button class="mode" id="mSpell" ${d.length?"":"disabled"}><b>Chính tả</b><span>Nhìn nghĩa, gõ lại từ tiếng Anh</span></button></div>
 ${!d.length?`<div class="empty" style="padding:20px 10px 0">${Object.keys(S.cards).length?"Hôm nay bạn đã ôn hết từ đến hạn.":"Chưa có từ nào đến hạn. Hãy học một chủ đề trước."}</div>`:""}
 <h2>Tự chọn phạm vi ôn</h2>
 <div class="panel">
  <span class="lbl" style="margin-top:0">Ôn từ đâu</span>
  <div class="seg">${segBtn("src","topics","Theo chủ đề")}${segBtn("src","learned",`Đã học (${learned.length})`)}${segBtn("src","lapse",`Hay quên (${lapsed.length})`)}</div>
  ${topicsHtml}
  <span class="lbl">Kiểu ôn</span>
  <div class="seg">${segBtn("mode","flip","Lật thẻ")}${segBtn("mode","spell","Chính tả")}</div>
  <span class="lbl">Số từ mỗi lượt</span>
  <div class="seg">${segBtn("n",10,"10")}${segBtn("n",20,"20")}${segBtn("n",30,"30")}${segBtn("n",0,"Tất cả")}</div>
  <button class="btn" id="goCustom" style="width:100%;margin-top:16px" ${p.length?"":"disabled"}>${p.length?`Bắt đầu ôn ${take} từ`:"Chưa có từ để ôn"}</button>
  ${p.length?"":`<p class="sub" style="margin-top:8px;text-align:center">${emptyMsg}</p>`}
 </div>`;
 $("#mFlip").onclick=()=>startReview("flip");$("#mSpell").onclick=()=>startReview("spell");
 const upd=()=>{save();render()};
 a.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{rv.src=b.dataset.src;upd()});
 a.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{rv.mode=b.dataset.mode;upd()});
 a.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{rv.n=+b.dataset.n;upd()});
 bindPicker(a,()=>rv.topics,v=>{rv.topics=v;upd()});
 const ta=$("#tAll");if(ta)ta.onclick=()=>{rv.topics=rv.topics.length>=NT?[]:Object.keys(TOPICS).map(Number);upd()};
 $("#goCustom").onclick=()=>{const ws=rv.src==="lapse"?shuffle(p.slice(0,take)):shuffle(p).slice(0,take);if(!ws.length)return;if(rv.mode==="spell")startSpell(ws,{review:true});else startStudy(ws,{review:true})}}

function topicPicker(sel){return cats().map(([name,f,t])=>{const ids=[];for(let i=f;i<=t;i++)ids.push(i);const all=ids.every(i=>sel.includes(i));return `<button class="catlbl" data-cat="${f}-${t}" aria-pressed="${all}"><span class="tick"></span>${name}</button><div class="chips">${ids.map(i=>{const x=topicStats(i);return `<button class="chipbtn" data-tp="${i}" aria-pressed="${sel.includes(i)}">${esc(TOPICS[i].vi)}${x.s?` <small>${x.k}/${x.n}</small>`:""}</button>`}).join("")}</div>`}).join("")}
function bindPicker(a,get,set){a.querySelectorAll("[data-tp]").forEach(b=>b.onclick=()=>{const i=+b.dataset.tp,sel=get();set(sel.includes(i)?sel.filter(x=>x!==i):[...sel,i])});
 a.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{const [f,t]=b.dataset.cat.split("-").map(Number);const ids=[];for(let i=f;i<=t;i++)ids.push(i);const sel=get();const all=ids.every(i=>sel.includes(i));set(all?sel.filter(x=>!ids.includes(x)):[...new Set([...sel,...ids])])})}
let q="";
function Search(a){
 a.innerHTML=`<h1>Tra từ</h1><input class="search" id="q" type="search" placeholder="Gõ từ tiếng Anh, nghĩa hoặc tên chủ đề" value="${esc(q)}" autocomplete="off" autocapitalize="none" enterkeyhint="search"><div id="res"></div>`;
 const inp=$("#q");
 const run=()=>{q=inp.value;const norm=x=>String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[’']/g,"'").trim();const s=norm(q);
  if(!s){$("#res").innerHTML=`<div class="empty">Tìm theo từ tiếng Anh (vd: correspondence), nghĩa tiếng Việt (vd: hóa đơn) hoặc tên chủ đề. Gõ không dấu cũng được.</div>`;return}
  const score=w=>{const ww=norm(w.w);if(ww===s||w.alt.includes(s))return 0;if(ww.startsWith(s)||w.alt.some(x=>x.startsWith(s)))return 1;if(ww.includes(s)||w.alt.some(x=>x.includes(s)))return 2;if(norm(w.m).includes(s))return 3;return 9};
  const r=ALL.map(w=>[score(w),w]).filter(x=>x[0]<9).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const tps=Object.values(TOPICS).filter(T=>T.words.length&&(norm(T.en).includes(s)||norm(T.vi).includes(s)));
  let h="";
  if(r.length)h+=`<h2>Từ vựng (${r.length})</h2>`+r.slice(0,120).map(w=>row(w).replace('<div class="w">',`<div class="w"><span style="font-size:12px;color:var(--muted)">${esc(TOPICS[w.t].vi)}</span>`)).join("");
  if(tps.length)h+=`<h2>Chủ đề (${tps.length})</h2>`+tps.map(T=>{const x=topicStats(T.id);return `<button class="topic" data-t="${T.id}"><span class="num ${x.k===x.n?"done":""}">${T.id===100?"★":T.id}</span><span class="nm"><b>${esc(T.vi)}</b><span>${esc(T.en)} · ${x.n} từ</span></span><span class="mini"><span class="bar"><i style="width:${x.k/x.n*100}%"></i></span><small>${x.k}/${x.n}</small></span></button>`}).join("");
  if(!h)h=`<div class="empty">Không thấy “${esc(q)}” trong ${ALL.length} từ của app. Thử gõ ngắn hơn hoặc gõ nghĩa tiếng Việt.</div>`;
  $("#res").innerHTML=h;bindRows($("#res"));
  $("#res").querySelectorAll(".topic").forEach(b=>b.onclick=()=>go({name:"topic",t:+b.dataset.t}))};
 inp.oninput=run;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}};run()}

function Settings(a){a.innerHTML=`<h1>Cài đặt</h1>
 <div class="setting"><div><b>Mặt trước thẻ</b><p class="sub">Chọn chiều học</p></div></div>
 <div class="seg" role="group"><button data-d="en" aria-pressed="${S.dir==="en"}">Anh → Việt</button><button data-d="vi" aria-pressed="${S.dir==="vi"}">Việt → Anh</button></div>
 <div class="setting" style="margin-top:8px"><div><b>Tự đọc phát âm</b><p class="sub">Đọc từ tiếng Anh khi thẻ hiện ra</p></div><button class="switch" role="switch" id="sp" aria-checked="${S.autoSpeak}" aria-label="Tự đọc phát âm"></button></div>
 <div class="setting"><div><b>Xóa tiến độ</b><p class="sub">Đưa toàn bộ 600 từ về chưa học</p></div><button class="btn ghost" id="rs">Xóa</button></div>
 <p class="sub" style="margin-top:20px;font-size:13px">Nguồn từ vựng: tài liệu “600 từ vựng TOEIC theo chủ đề thường gặp” của ZIM Academy, đã chỉnh lại nghĩa cho ngắn gọn, mỗi chủ đề chỉ giữ một dạng của mỗi từ. Chủ đề 51–70 được bổ sung thêm. Các từ trong tên chủ đề cũng là thẻ học (đánh dấu “tên chủ đề”).</p>`;
 a.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{S.dir=b.dataset.d;save();render()});
 $("#sp").onclick=()=>{S.autoSpeak=!S.autoSpeak;save();render()};
 $("#rs").onclick=()=>{if(confirm("Xóa toàn bộ tiến độ học? Không thể hoàn tác.")){S.cards={};S.streak={last:"",n:0};save();toast("Đã xóa tiến độ");render()}}}

render();
</script></body></html>
